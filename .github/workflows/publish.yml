name: Publish npm

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      should_publish: ${{ steps.package.outputs.should_publish }}
      package_filename: ${{ steps.pack.outputs.filename }}
      package_sha256: ${{ steps.pack.outputs.sha256 }}
      package_artifact_id: ${{ steps.upload_package.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install pinned npm CLI
        shell: bash
        run: |
          npm install --global --ignore-scripts npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - name: Install dependencies
        run: bun ci
      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Package version is not valid semver: $package_version" >&2
            exit 1
          fi

          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "Version $package_version is already published; npm publish will be skipped."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Run unit and integration tests
        run: bun run test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        run: bun run test:e2e
      - name: Build publishable package
        run: bun run build:cli
      - name: Pack and validate publishable package
        id: pack
        env:
          EXPECTED_PACKAGE_NAME: ${{ steps.package.outputs.name }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          mkdir package-artifact
          npm pack --ignore-scripts --pack-destination package-artifact --json > package-artifact/pack.json

          package_filename="$(node -e "const p=require('./package-artifact/pack.json'); if (p.length !== 1 || !p[0].filename) process.exit(1); process.stdout.write(p[0].filename)")"
          package_path="package-artifact/$package_filename"
          test -f "$package_path"

          packed_name="$(tar -xOf "$package_path" package/package.json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => process.stdout.write(JSON.parse(s).name))")"
          packed_version="$(tar -xOf "$package_path" package/package.json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => process.stdout.write(JSON.parse(s).version))")"
          test "$packed_name" = "$EXPECTED_PACKAGE_NAME"
          test "$packed_version" = "$EXPECTED_PACKAGE_VERSION"

          package_sha256="$(sha256sum "$package_path" | cut -d ' ' -f 1)"
          echo "filename=$package_filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$package_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload publishable package
        id: upload_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: package-artifact/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish package
    needs: verify
    if: needs.verify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm CLI
        shell: bash
        run: |
          npm install --global --ignore-scripts npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.package_artifact_id }}
          path: package-artifact
      - name: Verify package digest
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.package_filename }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        shell: bash
        run: echo "$PACKAGE_SHA256  package-artifact/$PACKAGE_FILE" | sha256sum --check --strict
      - name: Publish to npm
        env:
          PACKAGE_FILE: ${{ needs.verify.outputs.package_filename }}
        run: npm publish "$GITHUB_WORKSPACE/package-artifact/$PACKAGE_FILE" --ignore-scripts --access public

  release:
    name: Create GitHub release
    needs:
      - verify
      - publish
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.verify.outputs.package_version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
